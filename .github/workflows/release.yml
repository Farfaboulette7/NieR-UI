# À chaque push sur main : compile le plugin, le met en zip au format attendu
# par Decky et publie une release. La dernière est toujours disponible à :
# https://github.com/Farfaboulette7/NieR-UI/releases/latest/download/NieRDeck.zip
# (Decky → Paramètres → Développeur → Installer un plugin depuis une URL).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types
        run: npm run typecheck

      # Version 0.1.<numéro de build> : affichée dans Decky et comparée par le bouton « Mettre à jour ».
      - name: Fixer la version
        run: npm version "0.1.${{ github.run_number }}" --no-git-tag-version

      - name: Compiler
        run: npm run build

      - name: Préparer le zip Decky
        run: |
          mkdir -p package/NieRDeck
          cp -r dist package.json plugin.json main.py README.md package/NieRDeck/
          cp src/nier-ui/fonts/OFL.txt package/NieRDeck/LICENSE-font.txt
          cd package && zip -r ../NieRDeck.zip NieRDeck

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: NieRDeck 0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Build automatique du commit ${{ github.sha }}.

            ${{ github.event.head_commit.message }}

            **Installation sur le Steam Deck** : Decky → Paramètres → Développeur → « Installer un plugin depuis une URL » :
            `https://github.com/Farfaboulette7/NieR-UI/releases/latest/download/NieRDeck.zip`
          files: NieRDeck.zip
