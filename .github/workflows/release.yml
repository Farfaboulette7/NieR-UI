# À chaque push sur main : compile le plugin, le met en zip au format attendu
# par Decky et publie une release. La dernière est toujours disponible à :
# https://github.com/Farfaboulette7/NieR-UI/releases/latest/download/NieRDeck.zip
# (Decky → Paramètres → Développeur → Installer un plugin depuis une URL).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types
        run: npm run typecheck

      # Version de FarfaLauncher (package.json) : NieRDeck suit le numéro du launcher. Un autre
      # push sans nouvelle version du launcher donne X.Y.Z.1, X.Y.Z.2... Affichée dans Decky et
      # comparée par le bouton « Mettre à jour ».
      - name: Fixer la version
        id: version
        run: |
          base=$(node -p "require('./package.json').version")
          # Tags déjà publiés pour cette version : vX.Y.Z, vX.Y.Z.1, vX.Y.Z.2...
          tags=$(git ls-remote --tags origin | sed -n "s|.*refs/tags/v\(${base//./\\.}\(\.[0-9]*\)\?\)$|\1|p")
          if [ -z "$tags" ]; then
            version="$base"
          else
            n=$(echo "$tags" | sed -n "s|^${base//./\\.}\.\([0-9]*\)$|\1|p" | sort -n | tail -1)
            version="${base}.$(( ${n:-0} + 1 ))"
          fi
          echo "Version : $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # npm refuse un 4e chiffre : la version est écrite directement.
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=process.argv[1];fs.writeFileSync('package.json',JSON.stringify(p,null,2))" "$version"

      - name: Compiler
        run: npm run build

      - name: Préparer le zip Decky
        run: |
          mkdir -p package/NieRDeck
          cp -r dist package.json plugin.json main.py catalogue.py README.md package/NieRDeck/
          cp src/nier-ui/fonts/OFL.txt package/NieRDeck/LICENSE-font.txt
          cd package && zip -r ../NieRDeck.zip NieRDeck

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: NieRDeck ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Build automatique du commit ${{ github.sha }}.

            ${{ github.event.head_commit.message }}

            **Installation sur le Steam Deck** : Decky → Paramètres → Développeur → « Installer un plugin depuis une URL » :
            `https://github.com/Farfaboulette7/NieR-UI/releases/latest/download/NieRDeck.zip`
          files: NieRDeck.zip
